<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RYEDZ · Music Player</title>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js">
  </script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js">
  </script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js">
  </script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js">
  </script>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

  <style>
    /* ===== RESET ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    :root {
      --glass-bg: rgba(255, 255, 255, 0.07);
      --glass-border: rgba(255, 255, 255, 0.12);
      --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      --glass-radius: 20px;
      --text-primary: #f0eaff;
      --text-secondary: rgba(240, 234, 255, 0.7);
      --accent: #a78bfa;
      --accent-glow: rgba(167, 139, 250, 0.3);
      --bg-dark: #0b0818;
      --splash-bg: #0b0818;
      --splash-title: #f0eaff;
      --splash-sub: rgba(240, 234, 255, 0.7);
      --splash-accent: #a78bfa;
      --splash-duration: 5s;
    }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg-dark);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ===== SPLASH SCREEN ===== */
    #splashScreen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--splash-bg);
      transition: opacity 0.8s ease, transform 0.8s ease;
      overflow: hidden;
      padding: 24px;
    }
    #splashScreen.hide {
      opacity: 0;
      transform: scale(1.02);
      pointer-events: none;
    }
    #splashScreen .splash-bg-image {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      opacity: 0.35;
      z-index: 0;
      filter: blur(2px);
      transition: background-image 0.6s ease;
    }
    #splashScreen .splash-video-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      opacity: 0.4;
      filter: blur(1px);
    }
    #splashScreen .splash-overlay-glow {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 40%, rgba(167, 139, 250, 0.15) 0%, transparent 70%);
      z-index: 1;
      pointer-events: none;
    }
    #splashScreen .splash-content {
      position: relative;
      z-index: 2;
      text-align: center;
      animation: splashPulse 2s ease-in-out infinite alternate;
    }
    @keyframes splashPulse {
      0% {
        transform: scale(1);
      }
      100% {
        transform: scale(1.02);
      }
    }
    #splashScreen .splash-logo {
      font-size: 72px;
      color: var(--splash-accent);
      margin-bottom: 12px;
      animation: splashFloat 3s ease-in-out infinite;
      display: inline-block;
      filter: drop-shadow(0 0 40px var(--splash-accent));
    }
    @keyframes splashFloat {
      0%,
      100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-12px);
      }
    }
    #splashScreen .splash-title {
      font-size: 42px;
      font-weight: 800;
      color: var(--splash-title);
      letter-spacing: -1px;
      margin-bottom: 4px;
      text-shadow: 0 0 60px rgba(167, 139, 250, 0.2);
    }
    #splashScreen .splash-title span {
      background: linear-gradient(135deg, var(--splash-accent), #c4b5fd);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    #splashScreen .splash-sub {
      font-size: 16px;
      color: var(--splash-sub);
      font-weight: 400;
      letter-spacing: 2px;
      margin-top: 4px;
      opacity: 0.8;
    }
    #splashScreen .splash-progress {
      margin-top: 36px;
      width: 160px;
      height: 3px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
      z-index: 2;
    }
    #splashScreen .splash-progress .bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--splash-accent), #c4b5fd);
      border-radius: 4px;
      animation: splashProgress var(--splash-duration) linear forwards;
    }
    @keyframes splashProgress {
      0% {
        width: 0%;
      }
      100% {
        width: 100%;
      }
    }
    #splashScreen .splash-timer-text {
      margin-top: 10px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.25);
      font-weight: 300;
      letter-spacing: 1px;
      z-index: 2;
      position: relative;
    }
    #splashScreen .splash-particles {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
    }
    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: var(--splash-accent);
      border-radius: 50%;
      opacity: 0.3;
      animation: particleFloat linear infinite;
    }
    @keyframes particleFloat {
      0% {
        transform: translateY(100vh) rotate(0deg) scale(0);
        opacity: 0;
      }
      10% {
        opacity: 0.4;
      }
      90% {
        opacity: 0.4;
      }
      100% {
        transform: translateY(-20vh) rotate(720deg) scale(1);
        opacity: 0;
      }
    }

    /* ===== GLASS ===== */
    .glass {
      background: var(--glass-bg);
      backdrop-filter: blur(24px) saturate(1.4);
      -webkit-backdrop-filter: blur(24px) saturate(1.4);
      border: 1px solid var(--glass-border);
      border-radius: var(--glass-radius);
      box-shadow: var(--glass-shadow);
    }
    ::-webkit-scrollbar {
      width: 4px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--accent);
      border-radius: 8px;
    }

    /* ===== AUTH ===== */
    #authPage {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-dark);
    }
    #authPage .auth-box {
      width: 400px;
      max-width: 92vw;
      padding: 40px 32px;
      text-align: center;
    }
    #authPage .auth-box h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 4px;
      background: linear-gradient(135deg, #c4b5fd, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    #authPage .auth-box .sub {
      color: var(--text-secondary);
      font-size: 14px;
      margin-bottom: 28px;
    }
    #authPage .auth-box input {
      width: 100%;
      padding: 14px 18px;
      margin-bottom: 14px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: 0.3s;
    }
    #authPage .auth-box input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    #authPage .auth-box input::placeholder {
      color: rgba(255, 255, 255, 0.3);
    }
    #authPage .auth-box .btn-primary {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #8b7bf7, #a78bfa);
      border: none;
      border-radius: 12px;
      color: #fff;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      transition: 0.3s;
      margin-top: 4px;
    }
    #authPage .auth-box .btn-primary:hover {
      transform: scale(1.02);
      box-shadow: 0 0 30px var(--accent-glow);
    }
    #authPage .auth-box .toggle-auth {
      margin-top: 18px;
      color: var(--text-secondary);
      font-size: 13px;
    }
    #authPage .auth-box .toggle-auth span {
      color: var(--accent);
      cursor: pointer;
      font-weight: 600;
    }
    #authPage .auth-box .toggle-auth span:hover {
      text-decoration: underline;
    }
    .auth-error {
      color: #f87171;
      font-size: 13px;
      margin-top: -6px;
      margin-bottom: 12px;
      display: none;
    }

    /* ===== MAIN APP ===== */
    #app {
      display: none;
      position: relative;
      z-index: 1;
      padding: 20px 24px 120px;
      max-width: 1400px;
      margin: 0 auto;
      min-height: 100vh;
    }

    /* ===== HEADER ===== */
    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 24px;
      margin-bottom: 28px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .app-header .logo {
      font-size: 22px;
      font-weight: 700;
      background: linear-gradient(135deg, #c4b5fd, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }
    .app-header .logo i {
      -webkit-text-fill-color: initial;
      color: var(--accent);
      margin-right: 6px;
    }
    .app-header .user-info {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 14px;
      color: var(--text-secondary);
    }
    .app-header .user-info .badge {
      background: var(--accent);
      color: #fff;
      padding: 2px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
    }
    .app-header .user-info .logout-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text-secondary);
      padding: 6px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      transition: 0.3s;
    }
    .app-header .user-info .logout-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
    }

    /* ===== TAB NAV ===== */
    .tab-nav {
      display: flex;
      gap: 6px;
      margin-bottom: 28px;
      flex-wrap: wrap;
      background: rgba(255, 255, 255, 0.03);
      padding: 6px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.04);
    }
    .tab-nav button {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      padding: 10px 24px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: 0.3s;
      font-family: inherit;
    }
    .tab-nav button:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.04);
    }
    .tab-nav button.active {
      background: rgba(167, 139, 250, 0.18);
      color: #fff;
      box-shadow: 0 0 20px rgba(167, 139, 250, 0.08);
    }

    /* ===== TAB CONTENT ===== */
    .tab-content {
      display: none;
      animation: fadeUp 0.4s ease;
    }
    .tab-content.active {
      display: block;
    }
    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(16px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ===== WELCOME ===== */
    .welcome-section {
      margin-bottom: 32px;
    }
    .welcome-section h2 {
      font-size: 28px;
      font-weight: 600;
    }
    .welcome-section h2 span {
      background: linear-gradient(135deg, #c4b5fd, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .welcome-section p {
      color: var(--text-secondary);
      margin-top: 2px;
      font-size: 15px;
    }

    /* ===== SONG GRID ===== */
    .song-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 18px;
      margin-top: 16px;
    }
    .song-card {
      padding: 16px 14px 18px;
      text-align: center;
      cursor: pointer;
      transition: 0.3s;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.04);
    }
    .song-card:hover {
      transform: translateY(-4px);
      background: rgba(255, 255, 255, 0.07);
      border-color: rgba(167, 139, 250, 0.2);
    }
    .song-card .thumb {
      width: 100%;
      aspect-ratio: 1/1;
      border-radius: 12px;
      object-fit: cover;
      background: rgba(255, 255, 255, 0.04);
      margin-bottom: 12px;
      border: 1px solid rgba(255, 255, 255, 0.04);
    }
    .song-card .title {
      font-weight: 600;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .song-card .artist {
      color: var(--text-secondary);
      font-size: 12px;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .song-card .duration {
      color: var(--text-secondary);
      font-size: 11px;
      margin-top: 4px;
    }
    .song-card .play-btn {
      margin-top: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      border: none;
      cursor: pointer;
      transition: 0.3s;
      font-size: 14px;
    }
    .song-card .play-btn:hover {
      transform: scale(1.1);
      box-shadow: 0 0 24px var(--accent-glow);
    }

    /* ===== ADMIN: ADD SONG ===== */
    .admin-add {
      padding: 24px 28px;
      margin-bottom: 28px;
    }
    .admin-add h3 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 12px;
    }
    .admin-add .row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .admin-add .row input {
      flex: 1;
      min-width: 220px;
      padding: 12px 18px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: 0.3s;
    }
    .admin-add .row input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    .admin-add .row input::placeholder {
      color: rgba(255, 255, 255, 0.3);
    }
    .admin-add .row .btn {
      padding: 12px 28px;
      background: linear-gradient(135deg, #8b7bf7, #a78bfa);
      border: none;
      border-radius: 12px;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
      font-size: 14px;
      white-space: nowrap;
    }
    .admin-add .row .btn:hover {
      transform: scale(1.02);
      box-shadow: 0 0 30px var(--accent-glow);
    }
    .admin-add .row .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none !important;
    }
    .admin-add .status {
      margin-top: 12px;
      font-size: 13px;
      color: var(--text-secondary);
    }
    .admin-add .status.success {
      color: #6ee7b7;
    }
    .admin-add .status.error {
      color: #f87171;
    }

    /* ===== ADMIN: UPLOAD MP3 MANUAL ===== */
    .upload-manual {
      padding: 24px 28px;
      margin-bottom: 28px;
    }
    .upload-manual .form-group {
      margin-bottom: 12px;
    }
    .upload-manual .form-group label {
      display: block;
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 4px;
      font-weight: 500;
    }
    .upload-manual .form-group input[type="text"],
    .upload-manual .form-group input[type="url"],
    .upload-manual .form-group input[type="file"] {
      width: 100%;
      padding: 10px 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: 0.3s;
    }
    .upload-manual .form-group input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    .upload-manual .form-group input::placeholder {
      color: rgba(255, 255, 255, 0.3);
    }
    .upload-manual .btn-upload {
      padding: 12px 32px;
      background: linear-gradient(135deg, #34d399, #6ee7b7);
      border: none;
      border-radius: 12px;
      color: #0b0818;
      font-weight: 700;
      cursor: pointer;
      transition: 0.3s;
      font-size: 14px;
      margin-top: 4px;
    }
    .upload-manual .btn-upload:hover {
      transform: scale(1.02);
      box-shadow: 0 0 30px rgba(52, 211, 153, 0.3);
    }
    .upload-manual .btn-upload:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none !important;
    }
    .upload-manual .upload-status {
      margin-top: 12px;
      font-size: 13px;
    }

    /* ===== ADMIN: SPLASH SETTINGS ===== */
    .splash-settings {
      padding: 24px 28px;
      margin-bottom: 28px;
    }
    .splash-settings h3 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 16px;
    }
    .splash-settings .form-group {
      margin-bottom: 14px;
    }
    .splash-settings .form-group label {
      display: block;
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 4px;
      font-weight: 500;
    }
    .splash-settings .form-group input[type="text"],
    .splash-settings .form-group input[type="url"],
    .splash-settings .form-group input[type="number"],
    .splash-settings .form-group select {
      width: 100%;
      padding: 10px 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: 0.3s;
    }
    .splash-settings .form-group input:focus,
    .splash-settings .form-group select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    .splash-settings .form-group input::placeholder {
      color: rgba(255, 255, 255, 0.3);
    }
    .splash-settings .form-group select option {
      background: #1a1530;
    }
    .splash-settings .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    .splash-settings .form-group input[type="color"] {
      height: 44px;
      padding: 4px;
      border-radius: 10px;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.08);
      cursor: pointer;
      width: 100%;
    }
    .splash-settings .btn-save {
      padding: 12px 32px;
      background: linear-gradient(135deg, #8b7bf7, #a78bfa);
      border: none;
      border-radius: 12px;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
      font-size: 14px;
      margin-top: 8px;
    }
    .splash-settings .btn-save:hover {
      transform: scale(1.02);
      box-shadow: 0 0 30px var(--accent-glow);
    }
    .splash-settings .btn-save:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none !important;
    }
    .splash-settings .preview-box {
      margin-top: 16px;
      border-radius: 12px;
      border: 1px dashed rgba(255, 255, 255, 0.1);
      overflow: hidden;
      background: rgba(255, 255, 255, 0.02);
      min-height: 200px;
      position: relative;
    }
    .splash-settings .preview-box .preview-content {
      width: 100%;
      height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      background: var(--bg-dark);
    }
    .splash-settings .preview-box .preview-icon {
      font-size: 36px;
      margin-bottom: 4px;
    }
    .splash-settings .preview-box .preview-title {
      font-size: 20px;
      font-weight: 700;
    }
    .splash-settings .preview-box .preview-sub {
      font-size: 13px;
      color: var(--text-secondary);
    }
    .splash-settings .preview-box img,
    .splash-settings .preview-box video {
      width: 100%;
      height: 200px;
      object-fit: cover;
      display: none;
    }
    .splash-settings .status-msg {
      margin-top: 12px;
